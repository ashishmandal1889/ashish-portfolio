# ===================================================================
# Production Profile (MongoDB Atlas / Render)
# ===================================================================

# MongoDB Atlas connection (Spring Boot 4.1.1 uses spring.mongodb.*)
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:portfolio_db}

# Legacy Spring Data MongoDB property aliases for compatibility
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:portfolio_db}

# Render port
server.port=${PORT:8080}

# Disable PostgreSQL/JPA only for the MongoDB production profile
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
