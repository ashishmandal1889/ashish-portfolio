spring.application.name=portfolio-backend

# Safe startup configuration: explicit default profile is local for development
spring.profiles.default=local
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.ashish.portfoliobackend=INFO

# Resume data seeding (disabled by default)
portfolio.seed.resume=false
portfolio.seed.project-links=false
